[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "race-rl"
version = "1.0.0"
description = "RACE-RL: Relation-Aware Coupled-Edit Reinforcement Learning for chiplet-based DNN accelerator design space exploration"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = ["numpy>=2.1,<3", "torch>=2.7,<3", "torchvision>=0.22,<1", "matplotlib>=3.8,<4"]

[project.scripts]
race-rl-cnn = "race_rl.accelerators.cnn_search:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
race_rl = ["accelerators/*.json"]
